# 1. (ตัด deploy ออก)
stages:
  - build
  - test

# 2. (ตัวแปรสำหรับ deploy ไม่ต้องใช้แล้ว)
variables:
  # (เรายังใช้ $CI_REGISTRY/$CI_PROJECT_PATH ได้ แต่ไม่จำเป็นต้องประกาศเอง)
  BACKEND_IMAGE: $CI_REGISTRY/$CI_PROJECT_PATH/backend:latest
  FRONTEND_IMAGE: $CI_REGISTRY/$CI_PROJECT_PATH/frontend:latest

# ----- STAGE: Build -----
build_backend:
  stage: build
  # --- ⬇️ (1) เพิ่ม 2 บรรทัดนี้ ⬇️ ---
  # บอกให้ Runner ใช้ "กล่อง" Docker (ที่มีคำสั่ง docker)
  image: docker:stable
  services:
    - docker:dind # (Docker-in-Docker)
  script:
    # ($CI_REGISTRY... GitLab.com จะใส่ค่าให้เองอัตโนมัติ)
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker build -f ./backend/Dockerfile.prod -t $BACKEND_IMAGE ./backend
    # ดัน "กล่อง" ไปเก็บที่ Registry ของ GitLab.com
    - docker push $BACKEND_IMAGE

build_frontend:
  stage: build
  # --- ⬇️ (2) เพิ่ม 2 บรรทัดนี้ ⬇️ ---
  image: docker:stable
  services:
    - docker:dind
  script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker build -f ./frontend/Dockerfile.prod -t $FRONTEND_IMAGE ./frontend
    - docker push $FRONTEND_IMAGE

# ----- STAGE: Test (ถ้ามี) -----
test_app:
  stage: test
  # (Test ยังคงใช้ Node.js)
  image: node:18-alpine 
  script:
    - cd backend
    - npm install
    - npm test

